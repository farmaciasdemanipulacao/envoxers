<!-- ─── Service Worker + PWA install ─── -->
<script>
  // Captura o prompt nativo de instalação antes do React precisar dele.
  window._installPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window._installPrompt = e;
    if (window._onInstallPromptReady) window._onInstallPromptReady();
  });

  window.addEventListener('appinstalled', function() {
    window._installPrompt = null;
    if (window._onInstallPromptReady) window._onInstallPromptReady();
  });

  window._isIOS = function() {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  };

  window._isStandalone = function() {
    if (window.navigator.standalone === true) return true;
    if (!window.matchMedia) return false;
    return [
      '(display-mode: standalone)',
      '(display-mode: fullscreen)',
      '(display-mode: minimal-ui)',
      '(display-mode: window-controls-overlay)'
    ].some(function(query) {
      try { return window.matchMedia(query).matches; } catch (_) { return false; }
    });
  };

  // Registra o Service Worker, necessário tanto para instalação quanto para Web Push.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(function(reg) {
      console.log('[SW] Registrado:', reg.scope);
    }).catch(function(err) {
      console.warn('[SW] Falha no registro:', err);
    });

    navigator.serviceWorker.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'NAVIGATE' && window.envoxersNavigate) {
        window.envoxersNavigate(event.data.view);
      }
    });
  }

  window.pushHelpers = {
    isSupported: function() {
      return window.isSecureContext === true &&
        'Notification' in window &&
        'serviceWorker' in navigator &&
        'PushManager' in window;
    },

    getPermission: function() {
      return ('Notification' in window) ? Notification.permission : 'unsupported';
    },

    _urlBase64ToUint8Array: function(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      var raw = window.atob(base64);
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    },

    subscribe: async function() {
      if (!this.isSupported()) return null;

      var permission = await Notification.requestPermission();
      if (permission !== 'granted') return null;

      var reg = await navigator.serviceWorker.ready;
      var vapidData = await window.EnvoxersAPI.api('/push/vapid-public-key');
      var existing = await reg.pushManager.getSubscription();
      var sub = existing || await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: this._urlBase64ToUint8Array(vapidData.public_key),
      });

      var json = sub.toJSON();
      var body = {
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
        user_agent: navigator.userAgent,
      };

      await window.EnvoxersAPI.api('/push/subscribe', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      return body;
    },

    unsubscribe: async function() {
      if (!this.isSupported()) return;
      var reg = await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      await window.EnvoxersAPI.api('/push/unsubscribe', {
        method: 'DELETE',
        body: JSON.stringify({ endpoint: endpoint })
      });
    },
  };
</script>
