name: Portal SECOVI - validação isolada

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/public/portal/**'
      - 'frontend/tests/portal-compile.mjs'
      - '.github/workflows/portal-security.yml'
  workflow_dispatch:

jobs:
  portal-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q backend/app backend/migrations/versions backend/tests
      - name: Authorization unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_portal_*.py" -v
  portal-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Portal JSX syntax
        run: node tests/portal-compile.mjs
      - name: Legacy app regression smoke
        run: npm run test:smoke
