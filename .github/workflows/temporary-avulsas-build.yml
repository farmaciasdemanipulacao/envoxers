name: Temporary Avulsas Asset Build
on:
  push:
    branches:
      - 'feat/demandas-avulsas-filtro-responsavel-20261023'
    paths:
      - '.github/workflows/temporary-avulsas-build.yml'
      - 'frontend/public/tc-demandas-avulsas.jsx'
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'feat/demandas-avulsas-filtro-responsavel-20261023'
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and smoke test
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test:smoke
      - name: Commit generated assets to feature branch
        run: |
          git config user.name 'envoxers-build'
          git config user.email 'envoxers-build@users.noreply.github.com'
          git add frontend/public/assets-runtime frontend/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: atualiza assets compilados do filtro avulso'
            git push origin HEAD:feat/demandas-avulsas-filtro-responsavel-20261023
          fi
