name: Frontend Envoxers

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-assets.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-assets.yml'

permissions:
  contents: write

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - name: Commit compiled assets on desktop protocol branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/desktop-protocol-20261104'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/assets-runtime frontend/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(frontend): recompilar login desktop onboarding"
            git push
          fi
        working-directory: .
      - name: Check compiled assets are committed
        run: git diff --exit-code -- frontend/public/assets-runtime frontend/public/index.html
        working-directory: .
