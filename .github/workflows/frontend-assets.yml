name: Frontend Envoxers

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-assets.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-assets.yml'

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - name: Check compiled assets are committed
        run: git diff --exit-code -- frontend/public/assets-runtime frontend/public/index.html
        working-directory: .
