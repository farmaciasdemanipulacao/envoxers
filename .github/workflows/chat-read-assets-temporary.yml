name: Chat read receipts - compile temporary
on:
  push:
    branches: [feat/chat-read-receipts-20261023]
    paths:
      - 'frontend/**'
      - '.github/workflows/chat-read-assets-temporary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Smoke tests
        run: npm run test:smoke
        working-directory: frontend
      - name: Commit compiled app assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/assets-runtime/app.js frontend/public/assets-runtime/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(frontend): compile chat read receipts"
            git push
          fi
