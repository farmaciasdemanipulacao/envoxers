name: Envoxers Desktop Windows (piloto)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/envoxers-desktop-windows.yml'

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Validate native ACL
        run: npm run test:acl
      - name: Validate configuration
        run: npm run tauri -- info
      - name: Build installer NSIS
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Envoxers-Windows-v0.2.2-Downloads
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
