name: Envoxers Desktop Windows (piloto)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/envoxers-desktop-windows.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Validate native ACL
        run: npm run test:acl
      - name: Validate release publisher
        run: python scripts/test-publisher.py
      - name: Validate configuration
        run: npm run tauri -- info
      - name: Build installer NSIS
        run: npm run build -- --bundles nsis
      - name: Publicar release do Desktop (uma vez por versão)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida: $version" }
          $tag = "desktop-v$version"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Instalador NSIS não encontrado" }
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível consultar releases" }
          if (@($existing | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "Release $tag já existe. Não será sobrescrita."
          } else {
            gh release create $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --title "Envoxers Desktop $version" --notes "Atualização oficial do Envoxers Desktop $version. O servidor da Envox assinará digitalmente este instalador antes de oferecê-lo aos aplicativos." --latest
            if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar release $tag" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Envoxers-Windows-v0.3.0-AutoUpdater
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
