# Host Nginx vhost for cliente-dev.envox.com.br.
# SSL block is added by Certbot after DNS points to this VPS.
server {
    listen 80;
    listen [::]:80;
    server_name cliente-dev.envox.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
