server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;

  location = / {
    try_files /portal/index.html =404;
  }

  location = /portal.css {
    try_files /portal/portal.css =404;
  }

  location = /tc-portal-api.jsx {
    try_files /portal/tc-portal-api.jsx =404;
  }

  location = /tc-portal-app.jsx {
    try_files /portal/tc-portal-app.jsx =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
